<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Straw Hat Jolly Roger">
  <g stroke="#111111" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- crossbones -->
    <g fill="#ffffff">
      <rect x="16" y="82" width="88" height="13" rx="6.5" transform="rotate(38 60 88)"/>
      <rect x="16" y="82" width="88" height="13" rx="6.5" transform="rotate(-38 60 88)"/>
      <circle cx="24" cy="73" r="7"/><circle cx="96" cy="73" r="7"/>
      <circle cx="24" cy="103" r="7"/><circle cx="96" cy="103" r="7"/>
    </g>
    <!-- skull (single outline) -->
    <path d="M60 34 C77 34 90 46 90 63 C90 75 83 83 75 87 L75 92 Q75 98 69 98 L51 98 Q45 98 45 92 L45 87 C37 83 30 75 30 63 C30 46 43 34 60 34 Z" fill="#ffffff"/>
    <!-- eyes -->
    <circle cx="49" cy="64" r="8.5" fill="#111111" stroke="none"/>
    <circle cx="71" cy="64" r="8.5" fill="#111111" stroke="none"/>
    <!-- nose -->
    <path d="M60 70 l-5 8 h10 z" fill="#111111" stroke="none"/>
    <!-- teeth -->
    <path d="M54 92 v5 M60 92 v6 M66 92 v5" fill="none" stroke-width="3.5"/>
    <!-- straw hat -->
    <ellipse cx="60" cy="32" rx="43" ry="11" fill="#ffc93c"/>
    <path d="M39 31 C39 13 46 6 60 6 C74 6 81 13 81 31 Z" fill="#ffd766"/>
    <path d="M39 27 C50 33 70 33 81 27 L81 20 C70 26 50 26 39 20 Z" fill="#ff5c8a" stroke-width="4"/>
  </g>
</svg>
